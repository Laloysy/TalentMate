<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TalentMate · 无法加载</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #eef3f8;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 360px;
        padding: 28px 22px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      }
      h1 { margin: 0 0 10px; font-size: 18px; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #6b7280; }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: #1677ff;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>页面加载失败</h1>
      <p>App 本地资源未能载入。请重新打开应用；如果问题仍然存在，请重新安装最新版本。</p>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </div>
  </body>
</html>
